name: Update Android downloads

on:
  workflow_dispatch:
  schedule:
    # Best-effort checks at 08:20, 10:20 and 12:20 Asia/Shanghai (UTC+8).
    # Keep 00:20 UTC; add two narrow catch-up opportunities after persistent
    # 4-6 hour schedule delays. Each attempt uses the same guarded update/PR path.
    # Do not skip later attempts after success: upstream may change meanwhile.
    # GitHub may delay or drop ALL slots; this is not a freshness deadline.
    # If a deadline is required, an external timer can call the existing
    # workflow_dispatch on master, then monitor completion and retry failures.
    # That bypasses schedule delivery, but runner availability is still best-effort.
    - cron: "20 0,2,4 * * *"

concurrency:
  group: update-android-downloads
  cancel-in-progress: false

permissions:
  checks: read
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out automation source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: master
          path: automation
          fetch-depth: 1

      - name: Check out published site
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: gh-pages
          path: site
          fetch-depth: 0

      - name: Run offline regression tests
        working-directory: automation
        run: python3 -m unittest discover -s tests -v

      - name: Run the guarded update
        run: >-
          python3 automation/scripts/update_android_downloads.py
          --site-dir site
          --mode write
          --report-json update-report.json

      - name: Report cross-validation (including no-change runs)
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("update-report.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              for check in report["repository_cross_validation"]:
                  if "warning" in check:
                      summary.write(f"**WARNING:** {check['warning']}\n\n")
              summary.write("```json\n" + json.dumps(report, ensure_ascii=False, indent=2) + "\n```\n")
          PY

      - name: Fail if the update escaped its allowlist
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t changed_files < <(git diff --name-only)
          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "No Android download changes detected."
            exit 0
          fi

          for file in "${changed_files[@]}"; do
            case "$file" in
              android-studio.html|android-emulator.html|index.html) ;;
              *)
                echo "Unexpected changed file: $file" >&2
                exit 1
                ;;
            esac
          done

          changed_lines="$(git diff --numstat -- android-studio.html android-emulator.html index.html | awk '{ additions += $1; deletions += $2 } END { print additions + deletions + 0 }')"
          if [ "$changed_lines" -gt 2000 ]; then
            echo "Refusing an unusually large generated diff: $changed_lines lines" >&2
            exit 1
          fi

      - name: Create or update the Android downloads PR
        id: download_pr
        working-directory: site
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- android-studio.html android-emulator.html index.html; then
            echo "No generated page changes; no PR needed."
            exit 0
          fi

          git config user.name "androiddevtools-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="automation/android-downloads"
          base_sha="$(git rev-parse HEAD)"
          git switch -C "$branch"
          git add android-studio.html android-emulator.html index.html
          git commit -m "chore: update Android downloads"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "HEAD:${branch}"

          body_file="../update-report.json"
          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base gh-pages --state open --json number --jq '.[0].number')"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title "chore: update Android downloads" --body-file "$body_file"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base gh-pages --head "$branch" \
              --title "chore: update Android downloads" --body-file "$body_file"
            pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base gh-pages --state open --json number --jq '.[0].number')"
          fi
          if [[ ! "$pr_number" =~ ^[0-9]+$ ]]; then
            echo "Could not identify the Android downloads PR" >&2
            exit 1
          fi
          {
            echo "number=$pr_number"
            echo "head_sha=$(git rev-parse HEAD)"
            echo "base_sha=$base_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Merge verified Android downloads PR
        if: github.ref == 'refs/heads/master' && steps.download_pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.download_pr.outputs.number }}
          HEAD_SHA: ${{ steps.download_pr.outputs.head_sha }}
          BASE_SHA: ${{ steps.download_pr.outputs.base_sha }}
        run: >-
          python3 automation/scripts/auto_merge_android_download_pr.py
          --repo "$GITHUB_REPOSITORY"
          --pr-number "$PR_NUMBER"
          --head-sha "$HEAD_SHA"
          --base-sha "$BASE_SHA"
